# maimaiKcalCalculator 配置
# 放在 <Package>\maimaiKcalCalculator.cfg（build.ps1 -Deploy 会自动生成一份）
# 改完重启游戏生效。

enabled = 1

# 体重（kg）。卡路里 = alpha * 体重 * 手部里程（米）
weight = 70
# 换算系数 kcal/(kg·m)。1.0e-3 是保守估计；想更"激进"可以调到 1.4e-3
alpha = 1.0e-3

# ---- 选曲画面：显示当前选中谱面的「预计消耗」
showselect = 1
# 相对中心卡片左上角的像素偏移（负 Y 向下）
selectx = 0
selecty = -204
selectfont = 18

# ---- 常驻 HUD：屏幕右下角显示「本曲 / 本轮」
showhud = 1
# 距上屏右边 / 下边的像素
hudx = 40
hudy = 24
hudfont = 20
# 手动指定挂到哪个画布（留空 = 自动挑上屏画布）
hudcanvas =

# 调试日志：每 5 秒打一次采样/里程统计（排查用）
debug = 0

# 1 = 文案退回纯 ASCII（日服字体缺简体字形时用）
ascii = 0
